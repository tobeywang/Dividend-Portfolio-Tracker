
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>實際配息紀錄 - Dividend Portfolio Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* ===== 頁面專屬樣式 ===== */
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 0;
    }

    nav {
      background: #2c3e50;
      padding: 12px 24px;
      display: flex;
      gap: 20px;
      align-items: center;
    }

    nav a {
      color: #ecf0f1;
      text-decoration: none;
      font-size: 15px;
      padding: 6px 12px;
      border-radius: 4px;
      transition: background 0.2s;
    }

    nav a:hover, nav a.active {
      background: #3498db;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    h1 {
      color: #2c3e50;
      margin-bottom: 20px;
    }

    /* ===== 統計卡片 ===== */
    .summary-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      text-align: center;
    }

    .card .label {
      font-size: 13px;
      color: #7f8c8d;
      margin-bottom: 8px;
    }

    .card .value {
      font-size: 26px;
      font-weight: bold;
      color: #27ae60;
    }

    /* ===== 新增表單 ===== */
    .form-section {
      background: #fff;
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 30px;
    }

    .form-section h2 {
      margin-top: 0;
      color: #2c3e50;
      font-size: 18px;
      border-bottom: 2px solid #3498db;
      padding-bottom: 10px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 13px;
      color: #555;
      font-weight: 600;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 9px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #3498db;
      outline: none;
    }

    .form-actions {
      margin-top: 20px;
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.85; }

    .btn-primary { background: #3498db; color: #fff; }
    .btn-danger  { background: #e74c3c; color: #fff; }
    .btn-success { background: #27ae60; color: #fff; }
    .btn-sm      { padding: 5px 12px; font-size: 12px; }

    /* ===== 篩選列 ===== */
    .filter-bar {
      background: #fff;
      border-radius: 10px;
      padding: 16px 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .filter-bar .form-group {
      min-width: 160px;
    }

    /* ===== 資料表格 ===== */
    .table-section {
      background: #fff;
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .table-header h2 {
      margin: 0;
      color: #2c3e50;
      font-size: 18px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    thead th {
      background: #2c3e50;
      color: #fff;
      padding: 12px 14px;
      text-align: left;
      cursor: pointer;
      user-select: none;
    }

    thead th:hover { background: #34495e; }

    tbody tr:nth-child(even) { background: #f8f9fa; }
    tbody tr:hover { background: #eaf4fb; }

    tbody td {
      padding: 11px 14px;
      border-bottom: 1px solid #eee;
      color: #333;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-tw  { background: #fdecea; color: #c0392b; }
    .badge-us  { background: #eaf4fb; color: #2980b9; }
    .badge-hk  { background: #fef9e7; color: #d68910; }
    .badge-other { background: #f0f0f0; color: #555; }

    .amount-positive { color: #27ae60; font-weight: bold; }

    /* ===== 空狀態 ===== */
    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: #aaa;
    }

    .empty-state .icon { font-size: 48px; }

    /* ===== 匯出按鈕 ===== */
    .export-btn {
      background: #27ae60;
      color: #fff;
    }
  </style>
</head>
<body>

<!-- 導覽列 -->
<nav>
  <a href="index.html">📊 投資組合</a>
  <a href="dividend-record.html" class="active">💰 實際配息紀錄</a>
  <!-- 可依原專案結構新增其他連結 -->
</nav>

<div class="container">
  <h1>💰 實際配息紀錄</h1>

  <!-- 統計卡片 -->
  <div class="summary-cards">
    <div class="card">
      <div class="label">今年總配息（TWD）</div>
      <div class="value" id="totalThisYear">\$0</div>
    </div>
    <div class="card">
      <div class="label">本月配息（TWD）</div>
      <div class="value" id="totalThisMonth">\$0</div>
    </div>
    <div class="card">
      <div class="label">歷史總配息（TWD）</div>
      <div class="value" id="totalAll">\$0</div>
    </div>
    <div class="card">
      <div class="label">紀錄筆數</div>
      <div class="value" id="recordCount" style="color:#3498db">0</div>
    </div>
  </div>

  <!-- 新增配息表單 -->
  <div class="form-section">
    <h2>➕ 新增配息紀錄</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>股票代號 / 名稱 *</label>
        <input type="text" id="stockCode" placeholder="例：0056 / 元大高股息" />
      </div>
      <div class="form-group">
        <label>配息日期 *</label>
        <input type="date" id="dividendDate" />
      </div>
      <div class="form-group">
        <label>入帳銀行 *</label>
        <select id="bank">
          <option value="">請選擇銀行</option>
          <option>台灣銀行</option>
          <option>第一銀行</option>
          <option>合作金庫</option>
          <option>國泰世華</option>
          <option>富邦銀行</option>
          <option>玉山銀行</option>
          <option>中信銀行</option>
          <option>永豐銀行</option>
          <option>元大銀行</option>
          <option>凱基銀行</option>
          <option>其他</option>
        </select>
      </div>
      <div class="form-group">
        <label>配息金額 *</label>
        <input type="number" id="amount" placeholder="例：3500" min="0" step="0.01" />
      </div>
      <div class="form-group">
        <label>幣別</label>
        <select id="currency">
          <option value="TWD">TWD 新台幣</option>
          <option value="USD">USD 美元</option>
          <option value="HKD">HKD 港幣</option>
          <option value="OTHER">其他</option>
        </select>
      </div>
      <div class="form-group">
        <label>每股配息（元）</label>
        <input type="number" id="perShare" placeholder="例：0.35" min="0" step="0.0001" />
      </div>
      <div class="form-group">
        <label>持有股數</label>
        <input type="number" id="shares" placeholder="例：10000" min="0" />
      </div>
      <div class="form-group">
        <label>稅後 / 稅前</label>
        <select id="taxStatus">
          <option value="after">稅後（實收）</option>
          <option value="before">稅前</option>
        </select>
      </div>
      <div class="form-group" style="grid-column: 1 / -1;">
        <label>備註</label>
        <input type="text" id="note" placeholder="例：季配息、特別股息…" />
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="addRecord()">✅ 新增紀錄</button>
      <button class="btn" style="background:#95a5a6;color:#fff" onclick="clearForm()">🔄 清除</button>
    </div>
  </div>

  <!-- 篩選列 -->
  <div class="filter-bar">
    <div class="form-group">
      <label>篩選年份</label>
      <select id="filterYear" onchange="renderTable()">
        <option value="">全部</option>
      </select>
    </div>
    <div class="form-group">
      <label>篩選月份</label>
      <select id="filterMonth" onchange="renderTable()">
        <option value="">全部</option>
        <option value="1">1 月</option><option value="2">2 月</option>
        <option value="3">3 月</option><option value="4">4 月</option>
        <option value="5">5 月</option><option value="6">6 月</option>
        <option value="7">7 月</option><option value="8">8 月</option>
        <option value="9">9 月</option><option value="10">10 月</option>
        <option value="11">11 月</option><option value="12">12 月</option>
      </select>
    </div>
    <div class="form-group">
      <label>篩選銀行</label>
      <select id="filterBank" onchange="renderTable()">
        <option value="">全部</option>
      </select>
    </div>
    <div class="form-group">
      <label>搜尋股票</label>
      <input type="text" id="filterStock" placeholder="代號或名稱" oninput="renderTable()" />
    </div>
    <button class="btn btn-success" onclick="exportCSV()">📥 匯出 CSV</button>
  </div>

  <!-- 資料表格 -->
  <div class="table-section">
    <div class="table-header">
      <h2>📋 配息紀錄列表</h2>
      <span id="filteredCount" style="color:#7f8c8d;font-size:13px"></span>
    </div>
    <table>
      <thead>
        <tr>
          <th onclick="sortBy('date')">配息日期 ↕</th>
          <th onclick="sortBy('stock')">股票</th>
          <th onclick="sortBy('bank')">入帳銀行</th>
          <th onclick="sortBy('amount')">配息金額</th>
          <th>幣別</th>
          <th>每股配息</th>
          <th>持有股數</th>
          <th>稅別</th>
          <th>備註</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="recordTableBody">
        <tr>
          <td colspan="10">
            <div class="empty-state">
              <div class="icon">💸</div>
              <p>尚無配息紀錄，請新增第一筆！</p>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script src="js/dividend-record.js"></script>
</body>
</html>
