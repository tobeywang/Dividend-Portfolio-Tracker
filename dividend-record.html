
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>個人資金投資管理系統 -實際配息紀錄</title>
  <link rel="stylesheet" href="dividend-record.css" />
</head>
<body>

<!-- 導覽列 -->
<nav>
  <a href="index.html">📊 資金管理</a>
  <a href="dividend-record.html" class="active">💰 實際配息紀錄</a>
  <!-- 可依原專案結構新增其他連結 -->
</nav>

<div class="container">
  <h1>💰 實際配息紀錄</h1>

  <!-- 統計卡片 -->
  <div class="summary-cards">
    <div class="card">
      <div class="label">今年總配息（TWD）</div>
      <div class="value" id="totalThisYear">\$0</div>
    </div>
    <div class="card">
      <div class="label">本月配息（TWD）</div>
      <div class="value" id="totalThisMonth">\$0</div>
    </div>
    <div class="card">
      <div class="label">歷史總配息（TWD）</div>
      <div class="value" id="totalAll">\$0</div>
    </div>
    <div class="card">
      <div class="label">紀錄筆數</div>
      <div class="value" id="recordCount" style="color:#3498db">0</div>
    </div>
  </div>

  <!-- 新增配息表單 -->
  <div class="form-section">
    <h2>➕ 新增配息紀錄</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>股票代號 / 名稱 *</label>
        <input type="text" id="stockCode" placeholder="例：0056 / 元大高股息" />
      </div>
      <div class="form-group">
        <label>配息日期 *</label>
        <input type="date" id="dividendDate" />
      </div>
      <div class="form-group">
        <label>入帳銀行 *</label>
        <select id="bank">
          <option value="">請選擇銀行</option>
          <option>台灣銀行</option>
          <option>第一銀行</option>
          <option>台新銀行</option>
          <option>國泰</option>
          <option>中信銀行</option>
          <option>其他</option>
        </select>
      </div>
      <div class="form-group">
        <label>配息金額 *</label>
        <input type="number" id="amount" placeholder="例：3500" min="0" step="0.01" />
      </div>
      <div class="form-group">
        <label>幣別</label>
        <select id="currency">
          <option value="TWD">TWD 新台幣</option>
          <option value="USD">USD 美元</option>
          <option value="HKD">HKD 港幣</option>
          <option value="OTHER">其他</option>
        </select>
      </div>
      <div class="form-group">
        <label>每股配息（元）</label>
        <input type="number" id="perShare" placeholder="例：0.35" min="0" step="0.0001" />
      </div>
      <div class="form-group">
        <label>持有股數</label>
        <input type="number" id="shares" placeholder="例：10000" min="0" />
      </div>
      <div class="form-group">
        <label>稅後 / 稅前</label>
        <select id="taxStatus">
          <option value="-">-</option>
          <option value="after">稅後（實收）</option>
          <option value="before">稅前</option>
        </select>
      </div>
      <div class="form-group" style="grid-column: 1 / -1;">
        <label>備註</label>
        <input type="text" id="note" placeholder="例：季配息、特別股息…" />
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="addRecord()">✅ 新增紀錄</button>
      <button class="btn" style="background:#95a5a6;color:#fff" onclick="clearForm()">🔄 清除</button>
    </div>
  </div>

  <!-- 篩選列 -->
  <div class="filter-bar">
    <div class="form-group">
      <label>篩選年份</label>
      <select id="filterYear" onchange="renderTable()">
        <option value="">全部</option>
      </select>
    </div>
    <div class="form-group">
      <label>篩選月份</label>
      <select id="filterMonth" onchange="renderTable()">
        <option value="">全部</option>
        <option value="1">1 月</option><option value="2">2 月</option>
        <option value="3">3 月</option><option value="4">4 月</option>
        <option value="5">5 月</option><option value="6">6 月</option>
        <option value="7">7 月</option><option value="8">8 月</option>
        <option value="9">9 月</option><option value="10">10 月</option>
        <option value="11">11 月</option><option value="12">12 月</option>
      </select>
    </div>
    <div class="form-group">
      <label>篩選銀行</label>
      <select id="filterBank" onchange="renderTable()">
        <option value="">全部</option>
      </select>
    </div>
    <div class="form-group">
      <label>搜尋股票</label>
      <input type="text" id="filterStock" placeholder="代號或名稱" oninput="renderTable()" />
    </div>
  </div>
  <!-- 資料表格 -->
  <div class="table-section">
    <div class="table-header">
      <div class="table-title-group">
        <h2>📋 配息紀錄列表</h2>
        <span id="filteredCount" style="color:#7f8c8d;font-size:13px"></span>
      </div>
      <div class="table-actions">
        <button class="btn btn-primary" onclick="reloadDataFromFile()">載入js</button>
        <button class="btn btn-success" onclick="exportCSV()">📥 匯出 CSV</button>
        <button class="btn btn-success" onclick="exportDataFile()">📥 匯出 js</button>
      </div>
    </div>
    <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th onclick="sortBy('date')" class="sticky top-0 z-10">配息日期 ↕</th>
          <th onclick="sortBy('stock')" class="sticky top-0 z-10">股票</th>
          <th onclick="sortBy('bank')" class="sticky top-0 z-10">入帳銀行</th>
          <th onclick="sortBy('amount')" class="sticky top-0 z-10">配息金額</th>
          <th class="sticky top-0 z-10">幣別</th>
          <th class="sticky top-0 z-10">每股配息</th>
          <th class="sticky top-0 z-10">持有股數</th>
          <th class="sticky top-0 z-10">稅別</th>
          <th class="sticky top-0 z-10">備註</th>
          <th class="sticky top-0 z-10">操作</th>
        </tr>
      </thead>
      <tbody id="recordTableBody">
        <tr>
          <td colspan="10">
            <div class="empty-state">
              <div class="icon">💸</div>
              <p>尚無配息紀錄，請新增第一筆！</p>
            </div>
          </td>
        </tr>
      </tbody>
      <tfoot>
        <tr class="table-total-row">
          <td colspan="3">合計</td>
          <td id="total-record-amount">0</td>
          <td></td>
          <td id="total-per-share">0.0000</td>
          <td></td>
          <td id="total-record-count">0 次</td>
          <td colspan="2"></td>
        </tr>
      </tfoot>
    </table>
    </div>
  </div>
</div>

<script src="dividend-data.js"></script>
<script src="dividend-record.js"></script>
</body>
</html>
